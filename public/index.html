<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat-Boat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        
        /* Custom styles for chat container and layout */
        #chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f3f4f6;
        }
        .message {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 8px;
            max-width: 75%;
        }
        .user {
            background: #d1fae5;
            align-self: flex-end;
        }
        .bot {
            background: #e5e7eb;
            align-self: flex-start;
        }
        #input-container {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            background: #ffffff;
        }
        #input-container input {
            flex: 1;
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-right: 8px;
        }
        #input-container button {
            background: #2b2b2f;
            color: #ffffff;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #input-container button:hover {
            background: #2a2a32;
        }
    </style>
</head>

<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white">

    <!-- Navbar with Dark Mode Toggle -->
    <nav class="bg-gray-800 dark:bg-gray-800 p-3 shadow-md">
        <div class="container mx-auto flex items-center justify-between">
            <div class="text-white text-xl font-semibold">
                <a href="#">AI Chat-Boat</a>
            </div>
            <div class="flex space-x-4">
                <!-- Dark/Light Mode Toggle -->
                <button id="toggle-button" onclick="toggleDarkMode()" class="p-2 rounded-full bg-gray-800 text-white hover:bg-gray-700 focus:outline-none transition-all">
                    <!-- Icon will be dynamically updated -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v2m0 12v2m9-9h-2M3 12H1m16.24-6.24a9 9 0 11-12.48 12.48A7 7 0 1012 3z" />
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Chat Container (Centered) -->
    <div class="flex justify-center items-center min-f-screen mt-10">
        <div id="chat-container">
            <div id="messages">
                <!-- Messages will appear here dynamically -->
            </div>
            <div id="input-container">
                <input id="user-input" type="text" placeholder="Type your message here..." class="outline-none">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>
    <script>
        // Toggle dark mode
        function toggleDarkMode() {
            const htmlElement = document.documentElement;
            const isDarkMode = htmlElement.classList.contains('dark');
            const toggleButton = document.getElementById('toggle-button');

            if (isDarkMode) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                toggleButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v2m0 12v2m9-9h-2M3 12H1m16.24-6.24a9 9 0 11-12.48 12.48A7 7 0 1012 3z" /></svg>`;
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                toggleButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 19.071a9 9 0 1111.314-11.314A7 7 0 1012 3v2a5 5 0 11-5 5h2a3 3 0 10-3 3h2a5 5 0 111.17-4.83z" /></svg>`;
            }
        }

        // Apply theme from localStorage on page load
        window.onload = () => {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('toggle-button').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 19.071a9 9 0 1111.314-11.314A7 7 0 1012 3v2a5 5 0 11-5 5h2a3 3 0 10-3 3h2a5 5 0 111.17-4.83z" /></svg>`;
            }
        };
    </script>
    <script>
        const messagesContainer = document.getElementById('messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-btn');

        const appendMessage = (text, sender) => {
            const message = document.createElement('div');
            message.className = `message ${sender}`;
            message.textContent = text;
            messagesContainer.appendChild(message);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        };

        const fetchBotResponse = async (question) => {
            try {
                const response = await fetch('/api/content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question }),
                });

                if (response.ok) {
                    const data = await response.json();
                    return data.result || "Sorry, I couldn't understand that.";
                } else {
                    throw new Error("Failed to fetch response");
                }
            } catch (error) {
                console.error(error);
                return "An error occurred while fetching the response.";
            }
        };

        sendButton.addEventListener('click', async () => {
            const userText = userInput.value.trim();
            if (userText) {
                appendMessage(userText, 'user');
                userInput.value = '';

                appendMessage("Typing...", 'bot'); // Placeholder while waiting for response
                const botMessage = await fetchBotResponse(userText);

                // Remove typing indicator and append actual response
                messagesContainer.querySelector('.bot:last-child').remove();
                appendMessage(botMessage, 'bot');
            }
        });

        userInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                sendButton.click();
            }
        });
    </script>

</body>
</html>
